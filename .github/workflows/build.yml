name: Build (Windows MSVC)

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          # Qt SVG ships inside the base Qt 6 install — it is NOT a separately
          # listable aqt module, so requesting it here makes the install fail.
          # ShaderTools (needed by CMakeLists.txt for the GPU renderer) IS a
          # separate module and must be requested explicitly.
          modules: 'qtshadertools'
          cache: true

      - name: Fetch ffmpeg
        run: ./tools/fetch-ffmpeg.ps1

      - name: Configure CMake
        # Let CMake pick whatever Visual Studio the runner has (pinning a
        # version breaks when the image updates). QT_ROOT_DIR is set by
        # install-qt-action and points at the Qt prefix.
        run: cmake -B build -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Regression tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage package
        run: ./tools/stage-package.ps1

      - name: Package smoke test
        run: ./tools/package-smoke.ps1 -PackageDir build/package

      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(POINTLESS VERSION ([0-9.]+)').Matches.Groups[1].Value
          if ('${{ github.ref_name }}' -ne "v$version") { throw 'Release tag and application version differ.' }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: POINTLESS-windows
          path: build/package/
          if-no-files-found: error

      - name: Zip release package
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          Compress-Archive -Path build/package/* -DestinationPath POINTLESS-windows-${{ github.ref_name }}.zip
          Get-FileHash POINTLESS-windows-${{ github.ref_name }}.zip -Algorithm SHA256 | Format-List | Out-File POINTLESS-windows-${{ github.ref_name }}.sha256

      - name: Upload diagnostic symbols
        uses: actions/upload-artifact@v4
        with:
          name: POINTLESS-symbols
          path: build/Release/*.pdb
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            POINTLESS-windows-${{ github.ref_name }}.zip
            POINTLESS-windows-${{ github.ref_name }}.sha256
